name: Commerce SKU database verification

# Permanent CI coverage for the commerce SKU standardization system
# (supabase/schema.sql + supabase/migrations/). Replaces "a developer
# manually ran commerce_sku_tests.sql once" with a check that runs on
# every push/PR touching the relevant files -- see
# supabase/verify_commerce_sku_migration.sh for exactly what it proves
# (fresh-schema apply, upgrade-path apply, schema parity, migration
# reapplication, access hardening, functional/negative-path suite, and
# real concurrent-selection scenarios).

on:
  # pull_request alone is sufficient while claude/commerce-sku-implementation
  # has an open PR -- every push to it re-triggers this. A push trigger on
  # the same branch name would double-run for every commit (confirmed: the
  # first real run produced two identical `verify`/`app-build-and-test`
  # pairs). Once this PR merges, a push trigger on `master` would be the
  # right addition for a future change to these files landing directly.
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/commerce-sku-db.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # origin/master is required as the "simulated production"
          # baseline for the upgrade-path check -- a shallow single-branch
          # checkout would not have it.
          fetch-depth: 0

      - name: Fetch origin/master
        run: git fetch origin master:refs/remotes/origin/master

      - name: Run full commerce SKU DB verification
        run: bash supabase/verify_commerce_sku_migration.sh

  app-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` (package.json, pre-existing, not introduced by this
          # PR) is `node --test lib/commerce-export.test.ts` -- it runs the
          # .ts file directly via Node's native TypeScript support, which
          # Node 20 does not have. This repo declares no engines/.nvmrc, so
          # there's no existing pin to match; 22 is the version this was
          # actually verified against (confirmed failing on 20 in this
          # workflow's first real run, passing on 22 locally) and is
          # current Node LTS.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (includes full TypeScript type-check)
        run: npm run build
        # No Supabase env vars needed here -- every route in this app is
        # server-rendered on demand (confirmed via a real `npm run build`
        # with the vars unset), so nothing touches the database at build
        # time.
