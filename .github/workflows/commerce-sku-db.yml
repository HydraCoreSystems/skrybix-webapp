name: Commerce SKU database verification

# Permanent CI coverage for the commerce SKU standardization system
# (supabase/schema.sql + supabase/migrations/). Replaces "a developer
# manually ran commerce_sku_tests.sql once" with a check that runs on
# every push/PR touching the relevant files -- see
# supabase/verify_commerce_sku_migration.sh for exactly what it proves
# (fresh-schema apply, upgrade-path apply, schema parity, migration
# reapplication, access hardening, functional/negative-path suite, and
# real concurrent-selection scenarios).
#
# Reliability Phase 1 (2026-08-22): this workflow's own app-build-and-test
# job was removed -- it was the ONLY place `npm test`/`npm run build` ran
# for this repo, and its `on:` block below is scoped to `paths:
# supabase/**`, so an ordinary application PR that never touches
# supabase/** triggered no CI at all. See .github/workflows/ci.yml, which
# has no path filter and now covers that ground on every push/PR. This
# workflow stays scoped purely to schema/migration verification.

on:
  # push:master is the actual regression gate for changes that land on
  # master without a matching open PR against a commerce-sku-* branch --
  # this was missing until now: PR #11 merged without this workflow ever
  # running against master afterward, since only pull_request was
  # configured. pull_request stays too, scoped the same way, for PR-time
  # feedback before merge; a same-commit double-run isn't a concern here
  # since push:master and pull_request never both fire for the same
  # commit (a merge commit is a push to master, not a synchronize event
  # on an open PR).
  push:
    branches:
      - master
    paths:
      - "supabase/**"
      - ".github/workflows/commerce-sku-db.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/commerce-sku-db.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # origin/master is required as the "simulated production"
          # baseline for the upgrade-path check -- a shallow single-branch
          # checkout would not have it.
          fetch-depth: 0

      - name: Fetch origin/master
        run: git fetch origin master:refs/remotes/origin/master

      - name: Run full commerce SKU DB verification
        run: bash supabase/verify_commerce_sku_migration.sh
