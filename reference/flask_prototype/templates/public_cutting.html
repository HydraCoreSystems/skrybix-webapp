<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cutting.cutting_id }} — Skrybix</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f7f5f0; margin:0; padding:24px; color:#222; }
    .card { max-width: 480px; margin: 0 auto; background:white; border-radius:12px; padding:24px; border:1px solid #ddd6c9; }
    h1 { font-size: 20px; margin: 0 0 4px; color:#2f5d3a; }
    .sub { color:#666; font-size:13px; margin-bottom:16px; }
    .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ cutting.full_display_name }}</h1>
    <div class="sub">{{ cutting.label_line1 }} {{ cutting.label_line2 }}</div>
    <div class="row"><span>Cutting ID</span><strong>{{ cutting.cutting_id }}</strong></div>
    <div class="row"><span>Date taken</span><strong>{{ cutting.date_taken }}</strong></div>
    <div class="row"><span>Status</span><strong>{{ 'Sold' if cutting.sold else 'In stock' }}</strong></div>
  </div>
</body>
</html>
